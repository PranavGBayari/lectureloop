services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      CORS_ORIGINS: http://localhost:3000
      DEMO_TRANSCRIPT: /demo/lecture_transcript.json
    volumes:
      - ./demo:/demo:ro
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    environment:
      # The browser talks to the backend through the host's published port.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
